[package]
name = "zo-cli"
version = "0.6.0"
edition = "2024"
description = "A fast, minimal CLI for interacting with LLMs via OpenRouter"
authors = ["Sven Taute"]
license = "MIT"
repository = "https://github.com/svent/zo"
homepage = "https://zo.svent.dev"
documentation = "https://zo.svent.dev"
readme = "README.md"
keywords = ["cli", "llm", "openrouter", "ai", "chat"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "zo"
path = "src/main.rs"

[dependencies]
openrouter-rs = "0.12.0"
base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
futures-util = "0.3"
pulldown-cmark = "0.9"
syntect = "5.1"
termcolor = "1.4"
crossterm = "0.27"
dirs = "5.0"
anyhow = "1.0"
fuzzy-matcher = "0.3"
schemars = "1.1"
similar = "2.4"
glob = "0.3"
rustyline = "14.0"
grep = "0.3"
ignore = "0.4"
regex = "1.11"
libc = "0.2"
